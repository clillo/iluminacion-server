<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa DMX - Canales Utilizados</title>
    <link rel="stylesheet" href="/css/dmx-map.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn-dmx">← Volver</a>
        <h1>🗺️ Mapa DMX</h1>
        <p class="subtitle">Visualización de canales utilizados en cada universo DMX</p>
        
        <div class="controls">
            <div class="filter-group">
                <label for="searchInput">Buscar Fixture:</label>
                <input type="text" id="searchInput" placeholder="Nombre del fixture...">
            </div>
            <button class="export-btn" onclick="exportToCSV()">📥 Exportar CSV</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Canales</div>
                <div class="stat-value" id="totalChannels">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Fixtures</div>
                <div class="stat-value" id="totalFixtures">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Universos</div>
                <div class="stat-value" id="totalUniverses">0</div>
            </div>
        </div>
        
        <div class="table-container">
            <table id="dmxTable">
                <thead id="tableHead">
                    <tr>
                        <th>Canal</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="10" class="loading">Cargando datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="/js/dmx-map.js"></script>
</body>
</html>
