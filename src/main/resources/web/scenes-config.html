<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Escenas</title>
    <link rel="stylesheet" href="/css/scenes-config.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Volver</a>
        <h1>🎭 Configuración de Escenas</h1>
        <p class="subtitle">Gestionar y editar escenas del sistema</p>
        
        <div id="message" class="message"></div>
        
        <div class="controls">
            <div class="filter-group" style="display: flex; gap: 10px; align-items: center;">
                <label for="subTypeFilter" style="font-weight: 600; color: #555;">Filtrar por SubType:</label>
                <select id="subTypeFilter" style="padding: 8px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px;">
                    <option value="">Todos</option>
                    <option value="robotic.position.static">robotic.position.static</option>
                </select>
            </div>
            <button class="refresh-btn" onclick="loadScenes()">🔄 Actualizar</button>
        </div>
        
        <div class="table-container">
            <table id="scenesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Path</th>
                        <th>SubType</th>
                        <th>Puntos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="loading">Cargando escenas...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Modal para editar escena -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Escena</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label>ID:</label>
                    <input type="text" id="editId" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Path:</label>
                    <input type="text" id="editPath" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>SubType:</label>
                    <input type="text" id="editSubType" placeholder="Ej: robotic.position.static">
                </div>
                <div style="text-align: right; margin-top: 20px;">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="save-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/js/scenes-config.js"></script>
</body>
</html>
